<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Control — Servicio de Vehículos de Reemplazo</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#1e293b; --panel:#ffffff; --panel-2:#f8fafc;
    --line:#e2e8f0; --line2:#cbd5e1;
    --ink:#0f172a; --muted:#64748b; --muted2:#94a3b8;
    --brand:#2563eb; --brand-d:#1d4ed8; --brand-soft:#eff6ff;
    --ok:#059669; --ok-soft:#ecfdf5;
    --warn:#d97706; --warn-soft:#fffbeb;
    --danger:#dc2626; --danger-soft:#fef2f2;
    --info:#0891b2; --info-soft:#ecfeff;
    --purple:#7c3aed; --purple-soft:#f5f3ff;
    --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--panel-2);color:var(--ink);font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}

  /* Layout */
  .app{display:flex;min-height:100vh}
  .side{width:250px;flex-shrink:0;background:var(--bg);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:20px 18px;border-bottom:1px solid #1e293b;display:flex;gap:11px;align-items:center}
  .brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .brand h1{font-size:14px;margin:0;color:#fff;font-weight:700;line-height:1.25}
  .brand p{margin:1px 0 0;font-size:11px;color:#64748b}
  nav{padding:12px 10px;flex:1;overflow:auto}
  .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#475569;padding:14px 10px 6px;font-weight:700}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#cbd5e1;font-size:13.5px;font-weight:500;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;transition:.12s}
  .nav-item:hover{background:#1e293b;color:#fff}
  .nav-item.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.35)}
  .nav-item .ico{font-size:16px;width:20px;text-align:center}
  .nav-item .badge{margin-left:auto;background:#334155;color:#cbd5e1;font-size:11px;padding:1px 8px;border-radius:20px;font-weight:600}
  .nav-item.active .badge{background:rgba(255,255,255,.25);color:#fff}
  .side-foot{padding:14px 18px;border-top:1px solid #1e293b;font-size:11px;color:#64748b}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
  .topbar h2{margin:0;font-size:18px;font-weight:700}
  .topbar .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
  .topbar .spacer{flex:1}
  .content{padding:26px 28px 60px;max-width:1240px;width:100%}

  /* Buttons */
  .btn{border:1px solid var(--line2);background:#fff;color:var(--ink);padding:9px 15px;border-radius:9px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.12s}
  .btn:hover{background:var(--panel-2);border-color:var(--muted2)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-d)}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.ok:hover{filter:brightness(.94)}
  .btn.ghost{background:none;border-color:transparent}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .btn.danger{color:var(--danger);border-color:#fecaca}
  .btn.danger:hover{background:var(--danger-soft)}

  /* Cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .card-h h3{margin:0;font-size:15px;font-weight:700}
  .card-h .sub{color:var(--muted);font-size:12px;margin-top:1px}
  .card-b{padding:20px}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .kpi .lab{color:var(--muted);font-size:12.5px;margin-top:5px;font-weight:500}
  .kpi .trend{position:absolute;top:18px;right:18px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}

  /* Grid helpers */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:1080px){.grid-2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr}}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;padding:11px 12px;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel-2)}
  .folio{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-weight:700;font-size:12.5px;color:var(--brand)}
  .plate{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.06em;background:#fef9c3;border:1px solid #fde047;color:#713f12;padding:3px 8px;border-radius:6px;font-size:12px;display:inline-block}

  /* Badges */
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .t-ingreso{background:var(--brand-soft);color:var(--brand-d)}
  .t-siniestro{background:var(--danger-soft);color:var(--danger)}
  .t-reemplazo{background:var(--purple-soft);color:var(--purple)}
  .s-solicitada{background:#f1f5f9;color:#475569}
  .s-servicio{background:var(--info-soft);color:var(--info)}
  .s-entregado{background:var(--warn-soft);color:var(--warn)}
  .s-retirado{background:var(--purple-soft);color:var(--purple)}
  .s-cerrada{background:var(--ok-soft);color:var(--ok)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

  /* Forms */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  label{font-size:12.5px;font-weight:600;color:#334155}
  label .req{color:var(--danger)}
  input[type=text],input[type=date],input[type=datetime-local],select,textarea{
    padding:10px 12px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--ink);width:100%;transition:.12s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  textarea{resize:vertical;min-height:76px}
  .hint{font-size:11.5px;color:var(--muted2)}

  /* Toolbar / filters */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{padding-left:36px}
  .search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted2)}
  .chip{padding:7px 13px;border-radius:20px;border:1px solid var(--line2);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* Timeline / control dates */
  .timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin-top:4px}
  .tl-step{text-align:center;position:relative;padding-top:26px}
  .tl-step::before{content:'';position:absolute;top:8px;left:0;right:0;height:2px;background:var(--line)}
  .tl-step:first-child::before{left:50%}
  .tl-step:last-child::before{right:50%}
  .tl-step .node{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--line2);z-index:2}
  .tl-step.done .node{background:var(--ok);border-color:var(--ok)}
  .tl-step.done::before{background:var(--ok)}
  .tl-step .tl-lab{font-size:11px;color:var(--muted);font-weight:600}
  .tl-step .tl-date{font-size:12px;font-weight:700;margin-top:2px}
  .tl-step.pending .tl-date{color:var(--muted2);font-weight:500}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:720px;box-shadow:0 24px 64px rgba(0,0,0,.3);animation:pop .18s ease}
  @keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
  .modal-h{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .modal-h h3{margin:0;font-size:17px;font-weight:700;flex:1}
  .modal-b{padding:24px}
  .modal-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--panel-2);border-radius:0 0 16px 16px}
  .x{width:32px;height:32px;border-radius:8px;border:none;background:var(--panel-2);color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center}
  .x:hover{background:var(--line);color:var(--ink)}

  .empty{text-align:center;padding:48px 20px;color:var(--muted)}
  .empty .ico{font-size:40px;opacity:.4;margin-bottom:10px}

  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border:none}
  .kv .k{color:var(--muted);font-weight:500}
  .kv .v{font-weight:600}
  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 12px}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:13px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.25);z-index:200;display:flex;align-items:center;gap:10px;transform:translateY(80px);opacity:0;transition:.28s}
  .toast.show{transform:none;opacity:1}
  .req-note{font-size:11px;color:var(--muted2);margin-top:14px}
  .hide{display:none!important}
  .veh-hist{font-size:12.5px}
  .veh-hist li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
  .veh-hist li:last-child{border:none}
  .mini-date{font-family:'SF Mono',ui-monospace,monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}

  /* ---- Login ---- */
  .auth-screen{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);padding:20px}
  .auth-card{background:#fff;border-radius:18px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.4);overflow:hidden}
  .auth-head{padding:30px 32px 22px;text-align:center}
  .auth-head .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#2563eb);
    display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
  .auth-head h1{margin:0;font-size:19px;font-weight:800}
  .auth-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
  .auth-body{padding:8px 32px 30px}
  .auth-body .field{margin-bottom:14px}
  .auth-err{background:var(--danger-soft);color:var(--danger);border:1px solid #fecaca;border-radius:9px;
    padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none}
  .auth-err.show{display:block}
  .auth-body .btn.primary{width:100%;justify-content:center;padding:12px}
  .auth-foot{text-align:center;color:var(--muted2);font-size:11px;padding:0 32px 22px}
  #app-root{display:none}
  #app-root.ready{display:block}

  /* ---- Usuario en barra lateral ---- */
  .userbox{padding:12px 14px;border-top:1px solid #1e293b;display:flex;align-items:center;gap:10px}
  .userbox .av{width:34px;height:34px;border-radius:9px;background:#334155;color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
  .userbox .who{flex:1;min-width:0}
  .userbox .who .nm{color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .userbox .who .rl{font-size:10.5px;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  .userbox .logout{background:none;border:none;color:#94a3b8;font-size:16px;padding:6px;border-radius:8px}
  .userbox .logout:hover{background:#1e293b;color:#fff}
  .rolechip{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
  .rolechip.jefe{background:#f5f3ff;color:#7c3aed}
  .rolechip.panel2{background:#eff6ff;color:#1d4ed8}
  .rolechip.panel3{background:#ecfdf5;color:#059669}

  /* ---- Panel de accesos ---- */
  .perm-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:720px){.perm-list{grid-template-columns:1fr}}
  .perm-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;transition:.12s}
  .perm-item:hover{border-color:var(--line2);background:var(--panel-2)}
  .perm-item.on{border-color:var(--brand);background:var(--brand-soft)}
  .perm-item .sw{width:40px;height:23px;border-radius:20px;background:var(--line2);position:relative;flex-shrink:0;transition:.15s}
  .perm-item .sw::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .perm-item.on .sw{background:var(--brand)}
  .perm-item.on .sw::after{left:19px}
  .perm-item .pico{font-size:19px;width:24px;text-align:center}
  .perm-item .pt{font-weight:700;font-size:13.5px}
  .perm-item .pd{font-size:11.5px;color:var(--muted)}
  .perm-item.locked{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>

<!-- ===== Pantalla de acceso ===== -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-card">
    <div class="auth-head">
      <div class="logo">🚗</div>
      <h1>Plataforma de Control</h1>
      <p>Vehículos de Reemplazo · Acceso</p>
    </div>
    <form class="auth-body" id="auth-form" autocomplete="on">
      <div class="auth-err" id="auth-err"></div>
      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" id="auth-email" placeholder="tucorreo@ejemplo.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="auth-pass" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary" id="auth-btn"><span>🔐</span> Ingresar</button>
    </form>
    <div class="auth-foot">Cada nivel ve solo las secciones que su superior le habilita.</div>
  </div>
</div>

<!-- ===== Aplicación (visible tras iniciar sesión) ===== -->
<div id="app-root">
<div class="app">
  <!-- Sidebar -->
  <aside class="side">
    <div class="brand">
      <div class="logo">🚗</div>
      <div>
        <h1>Plataforma de Control</h1>
        <p>Vehículos de Reemplazo</p>
      </div>
    </div>
    <nav>
      <div class="nav-label">Operación</div>
      <button class="nav-item active" data-view="panel"><span class="ico">📊</span> Panel de control</button>
      <button class="nav-item hide" data-view="municipios" id="nav-municipios"><span class="ico">🏛️</span> Municipalidades <span class="badge" id="badge-mun">0</span></button>
      <button class="nav-item" data-view="solicitudes"><span class="ico">📋</span> Solicitudes <span class="badge" id="badge-sol">0</span></button>
      <button class="nav-item" data-view="vehiculos"><span class="ico">🚙</span> Vehículos <span class="badge" id="badge-veh">0</span></button>
      <div class="nav-label">Gestión</div>
      <button class="nav-item" data-view="nueva"><span class="ico">➕</span> Nueva solicitud</button>
      <button class="nav-item" data-view="exportar"><span class="ico">📤</span> Exportar datos</button>
      <button class="nav-item" data-view="requisitos"><span class="ico">✅</span> Requisitos</button>
      <div class="nav-label hide" id="nav-label-admin">Administración</div>
      <button class="nav-item hide" data-view="usuarios" id="nav-usuarios"><span class="ico">👥</span> Usuarios</button>
      <button class="nav-item hide" data-view="accesos" id="nav-accesos"><span class="ico">🔐</span> Gestión de accesos</button>
    </nav>
    <div class="userbox" id="userbox">
      <div class="av" id="user-av">–</div>
      <div class="who">
        <div class="nm" id="user-nm">—</div>
        <div class="rl" id="user-rl">—</div>
      </div>
      <button class="logout" id="btn-logout" title="Cerrar sesión">⏻</button>
    </div>
    <div class="side-foot">
      Cumple bases de licitación · v2.0
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div>
        <h2 id="view-title">Panel de control</h2>
        <div class="sub" id="view-sub">Resumen general del servicio</div>
      </div>
      <div class="spacer"></div>
      <button class="btn primary" id="topbar-nueva" onclick="openNueva()"><span>➕</span> Nueva solicitud</button>
    </div>
    <div class="content" id="content"><!-- render --></div>
  </div>
</div>

<!-- Modal detalle -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"><!-- render --></div>
</div>

<div class="toast" id="toast"></div>
</div><!-- /#app-root -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIGURACIÓN SUPABASE
   Reemplaza estos dos valores por los de tu proyecto
   (Supabase → Project Settings → API). La anon key es pública.
   ============================================================ */
const SUPABASE_URL = 'https://eopilefylzusqqggachm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_KRsV3ilrT9nsoSRDeCT_LA_8czZ8FhS';

const sb = (window.supabase && SUPABASE_URL.indexOf('http') === 0)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* ============================================================
   ESTADO DE SESIÓN Y PERMISOS
   ============================================================ */
const ALL_SECTIONS = ['panel','solicitudes','vehiculos','nueva','exportar','requisitos'];
const SECTION_INFO = {
  panel:       {label:'Panel de control', ico:'📊', desc:'Resumen general del servicio'},
  solicitudes: {label:'Solicitudes',      ico:'📋', desc:'Historial de solicitudes y fechas'},
  vehiculos:   {label:'Vehículos',        ico:'🚙', desc:'Registro de placas patentes'},
  nueva:       {label:'Nueva solicitud',  ico:'➕', desc:'Crear ingresos, siniestros y reemplazos'},
  exportar:    {label:'Exportar datos',   ico:'📤', desc:'Extracción de la base de datos'},
  requisitos:  {label:'Requisitos',       ico:'✅', desc:'Trazabilidad con las bases'},
};
const ALL_ACTIONS = ['crear','editar','eliminar','exportar'];
const ACTION_INFO = {
  crear:    {label:'Crear',    ico:'➕',  desc:'Crear solicitudes y registrar vehículos'},
  editar:   {label:'Editar',   ico:'✏️', desc:'Actualizar fechas, estado y datos'},
  eliminar: {label:'Eliminar', ico:'🗑️', desc:'Eliminar solicitudes y vehículos'},
  exportar: {label:'Exportar', ico:'📤',  desc:'Descargar datos (CSV / JSON)'},
};
const ROLE_LABEL = {jefe:'Jefe', panel2:'Panel 2', panel3:'Panel 3'};

let session = null;        // sesión de Supabase
let myRole = null;         // 'jefe' | 'panel2' | 'panel3'
let myName = '';           // nombre / correo
// Permisos por nivel: cada nivel tiene secciones (qué ve) y acciones (qué puede hacer)
let perms = {panel2:{sections:[],actions:[]}, panel3:{sections:[],actions:[]}};

/* Secciones que YO puedo ver, según mi rol */
function mySections(){
  if(myRole === 'jefe')   return ALL_SECTIONS.slice();
  if(myRole === 'panel2') return (perms.panel2.sections||[]).slice();
  if(myRole === 'panel3') return (perms.panel3.sections||[]).slice();
  return [];
}
/* Acciones que YO puedo ejecutar, según mi rol */
function myActions(){
  if(myRole === 'jefe')   return ALL_ACTIONS.slice();
  if(myRole === 'panel2') return (perms.panel2.actions||[]).slice();
  if(myRole === 'panel3') return (perms.panel3.actions||[]).slice();
  return [];
}
/* ¿Puedo ejecutar esta acción? */
function can(action){ return myActions().includes(action); }
/* ¿A qué nivel le configuro accesos? */
function targetRole(){
  if(myRole === 'jefe')   return 'panel2';
  if(myRole === 'panel2') return 'panel3';
  return null;
}
/* El Jefe/Panel 2 tienen la vista de administración de accesos */
function canManage(){ return myRole === 'jefe' || myRole === 'panel2'; }
function isAllowedView(view){
  if(view === 'accesos' || view === 'municipios' || view === 'usuarios') return canManage();
  if(view === 'nueva') return mySections().includes('nueva') && can('crear');
  return mySections().includes(view);
}

/* ============================================================
   AUTENTICACIÓN
   ============================================================ */
function authErr(msg){
  const e = document.getElementById('auth-err');
  e.textContent = msg; e.classList.add('show');
}
async function doLogin(ev){
  ev.preventDefault();
  if(!sb){ authErr('La plataforma aún no está conectada a la base de datos.'); return; }
  const email = document.getElementById('auth-email').value.trim();
  const pass  = document.getElementById('auth-pass').value;
  const btn = document.getElementById('auth-btn');
  btn.disabled = true; btn.innerHTML = 'Ingresando…';
  document.getElementById('auth-err').classList.remove('show');
  const {error} = await sb.auth.signInWithPassword({email, password:pass});
  btn.disabled = false; btn.innerHTML = '<span>🔐</span> Ingresar';
  if(error){
    authErr(error.message === 'Invalid login credentials'
      ? 'Correo o contraseña incorrectos.' : error.message);
  }
}
async function doLogout(){
  if(sb) await sb.auth.signOut();
  location.reload();
}
async function loadProfileAndPerms(){
  // Perfil (rol)
  const {data:prof} = await sb.from('profiles').select('role,full_name').eq('id', session.user.id).maybeSingle();
  myRole = prof?.role || 'panel3';
  myName = prof?.full_name || session.user.email;
  // Permisos en cascada (secciones + acciones)
  const {data:prows} = await sb.from('permissions').select('target_role,sections,actions');
  perms = {panel2:{sections:[],actions:[]}, panel3:{sections:[],actions:[]}};
  (prows||[]).forEach(r => { perms[r.target_role] = {sections:r.sections||[], actions:r.actions||[]}; });
}
function subscribePerms(){
  if(!sb) return;
  sb.channel('perms-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'permissions'}, async () => {
      const {data:prows} = await sb.from('permissions').select('target_role,sections,actions');
      perms = {panel2:{sections:[],actions:[]}, panel3:{sections:[],actions:[]}};
      (prows||[]).forEach(r => { perms[r.target_role] = {sections:r.sections||[], actions:r.actions||[]}; });
      applyPermissions();
      render();
    }).subscribe();
}

/* Aplica visibilidad de nav + info de usuario */
function applyPermissions(){
  const allowed = mySections();
  document.querySelectorAll('.nav-item[data-view]').forEach(b => {
    const v = b.dataset.view;
    if(v === 'accesos' || v === 'municipios') return; // se manejan aparte
    // 'nueva' además requiere la acción 'crear'
    const ok = allowed.includes(v) && (v !== 'nueva' || can('crear'));
    b.classList.toggle('hide', !ok);
  });
  // Municipalidades (solo jefe / panel2)
  document.getElementById('nav-municipios').classList.toggle('hide', !canManage());
  // Vista de administración (solo jefe / panel2)
  document.getElementById('nav-usuarios').classList.toggle('hide', !canManage());
  document.getElementById('nav-accesos').classList.toggle('hide', !canManage());
  document.getElementById('nav-label-admin').classList.toggle('hide', !canManage());
  // Botón "Nueva solicitud" del topbar (requiere sección 'nueva' y acción 'crear')
  const tn = document.getElementById('topbar-nueva');
  if(tn) tn.classList.toggle('hide', !(allowed.includes('nueva') && can('crear')));
  // Caja de usuario
  document.getElementById('user-nm').textContent = myName;
  document.getElementById('user-rl').textContent = ROLE_LABEL[myRole] || myRole;
  document.getElementById('user-av').textContent = (myName||'?').trim().charAt(0).toUpperCase();
  // Si la vista actual dejó de estar permitida, ir a la primera disponible
  if(!isAllowedView(currentView)){
    const first = mySections()[0] || (canManage() ? 'accesos' : null);
    if(first) nav(first);
    else { $('#content').innerHTML = `<div class="empty"><div class="ico">🔒</div>No tienes secciones habilitadas todavía. Contacta a tu superior.</div>`; }
  }
}

/* Carga de datos reales (solicitudes + municipalidades) */
async function loadData(){
  if(!sb) return;
  const {data:sol} = await sb.from('solicitudes').select('*').order('created_at',{ascending:false});
  solicitudes = sol || [];
  const {data:veh} = await sb.from('vehiculos').select('*').order('created_at',{ascending:false});
  vehiculos = veh || [];
  if(myRole==='jefe' || myRole==='panel2'){
    const {data:profs} = await sb.from('profiles').select('id,full_name,role');
    allProfiles = profs || [];
    municipios = allProfiles.filter(p=>p.role==='panel3');
  } else { allProfiles = []; municipios = []; }
}
function subscribeData(){
  if(!sb) return;
  sb.channel('data-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'solicitudes'}, async () => { await loadData(); render(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'vehiculos'}, async () => { await loadData(); render(); })
    .subscribe();
}

async function startApp(){
  await loadProfileAndPerms();
  await loadData();
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app-root').classList.add('ready');
  applyPermissions();
  const first = mySections().includes('panel') ? 'panel' : (mySections()[0] || (canManage() ? 'accesos' : null));
  if(first) nav(first); else applyPermissions();
  subscribePerms();
  subscribeData();
}

/* ============================================================
   MODELO DE DATOS (en memoria — prototipo)
   Entidades: solicitudes y vehículos.
   Fechas de control exigidas por las bases:
     - fechaSolicitud
     - fechaIngresoServicio
     - fechaNotificacionEntrega  (notificación entrega de vehículo)
     - fechaRetiro               (retiro del vehículo desde instalaciones)
   ============================================================ */

const TIPOS = ['Ingreso a servicio','Siniestro','Vehículo de reemplazo'];
const ESTADOS = ['Solicitada','En servicio','Vehículo entregado','Vehículo retirado','Cerrada'];
const RESP_ESTADOS = ['En revisión','Aprobada','Rechazada'];

let vehiculos = [];   // vehículos reales, asignados por municipalidad (Panel 2 los designa)

// Datos reales desde Supabase
let solicitudes = [];   // solicitudes (municipalidad las envía, Panel 2 responde)
let municipios = [];    // perfiles de municipalidades (role='panel3'), para Jefe/Panel 2
let allProfiles = [];   // todos los perfiles (para administración de usuarios)

/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = s => document.querySelector(s);
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const esc = s => (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);

function tipoTag(t){
  const cls = t==='Ingreso a servicio'?'t-ingreso':t==='Siniestro'?'t-siniestro':'t-reemplazo';
  return `<span class="tag ${cls}"><span class="dot"></span>${esc(t)}</span>`;
}
function estadoTag(e){
  const map={'Solicitada':'s-solicitada','En servicio':'s-servicio','Vehículo entregado':'s-entregado','Vehículo retirado':'s-retirado','Cerrada':'s-cerrada'};
  return `<span class="tag ${map[e]||'s-solicitada'}">${esc(e)}</span>`;
}
function plate(p){ return p ? `<span class="plate">${esc(p)}</span>` : '<span style="color:var(--muted2)">Sin asignar</span>'; }
function respTag(e){
  const map={'En revisión':'s-entregado','Aprobada':'s-cerrada','Rechazada':'t-siniestro'};
  const ico={'En revisión':'⏳','Aprobada':'✅','Rechazada':'⛔'};
  e=e||'En revisión';
  return `<span class="tag ${map[e]||'s-solicitada'}">${ico[e]||''} ${esc(e)}</span>`;
}
const fmtD = d => d ? new Date((d.length>10?d:d+'T00:00:00')).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'}) : '—';

function toast(msg){
  const t=$('#toast'); t.innerHTML='✓ '+esc(msg); t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
let currentView='panel';
const VIEW_META={
  panel:['Panel de control','Resumen general del servicio'],
  solicitudes:['Solicitudes','Historial completo de acciones y fechas de control'],
  vehiculos:['Vehículos','Registro de placas patentes e historial'],
  nueva:['Nueva solicitud','Agendar ingreso, notificar siniestro o solicitar reemplazo'],
  exportar:['Exportar datos','Extracción de la base de datos'],
  requisitos:['Requisitos','Trazabilidad con las bases de licitación'],
  municipios:['Municipalidades','Solicitudes por municipalidad y respuestas'],
  usuarios:['Usuarios','Crear y ver las cuentas del nivel inferior'],
  accesos:['Gestión de accesos','Habilita qué puede ver y hacer el nivel inferior'],
};
function nav(view){
  if(!isAllowedView(view)){ toast('No tienes acceso a esa sección'); return; }
  currentView=view;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  $('#view-title').textContent=VIEW_META[view][0];
  $('#view-sub').textContent=VIEW_META[view][1];
  render();
}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));

function refreshBadges(){
  $('#badge-sol').textContent=solicitudes.length;
  $('#badge-veh').textContent=vehiculos.length;
  const bm=$('#badge-mun'); if(bm) bm.textContent=municipios.length;
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function render(){
  refreshBadges();
  const c=$('#content');
  if(currentView==='panel') c.innerHTML=renderPanel();
  else if(currentView==='solicitudes') c.innerHTML=renderSolicitudes();
  else if(currentView==='vehiculos') c.innerHTML=renderVehiculos();
  else if(currentView==='nueva') c.innerHTML=renderNueva();
  else if(currentView==='exportar') c.innerHTML=renderExportar();
  else if(currentView==='requisitos') c.innerHTML=renderRequisitos();
  else if(currentView==='municipios') c.innerHTML=renderMunicipios();
  else if(currentView==='usuarios') c.innerHTML=renderUsuarios();
  else if(currentView==='accesos') c.innerHTML=renderAccesos();
  attachViewHandlers();
}

/* ---------- GESTIÓN DE ACCESOS (cascada) ---------- */
function permItem(kind, key, info, on, canToggle){
  return `<div class="perm-item ${on?'on':''} ${canToggle?'':'locked'}" data-${kind}="${key}" ${canToggle?'':'title="No puedes delegar algo que tú no tienes"'}>
    <span class="pico">${info.ico}</span>
    <div style="flex:1">
      <div class="pt">${esc(info.label)}</div>
      <div class="pd">${esc(info.desc)}</div>
    </div>
    <div class="sw"></div>
  </div>`;
}
function renderAccesos(){
  const tgt = targetRole();
  if(!tgt) return `<div class="empty"><div class="ico">🔒</div>No tienes permisos de administración.</div>`;
  // Lo que YO puedo delegar (el Jefe delega todo; el Panel 2 solo lo que tiene)
  const delSecs = myRole==='jefe' ? ALL_SECTIONS.slice() : mySections().slice();
  const delActs = myRole==='jefe' ? ALL_ACTIONS.slice()  : myActions().slice();
  const curSecs = new Set(perms[tgt].sections || []);
  const curActs = new Set(perms[tgt].actions  || []);
  const tgtLabel = ROLE_LABEL[tgt];

  const secItems = ALL_SECTIONS.map(k=>permItem('sec', k, SECTION_INFO[k], curSecs.has(k), delSecs.includes(k))).join('');
  const actItems = ALL_ACTIONS.map(k=>permItem('act', k, ACTION_INFO[k], curActs.has(k), delActs.includes(k))).join('');

  // Resumen del nivel más abajo (solo informativo para el Jefe)
  let extra = '';
  if(myRole==='jefe'){
    const p3s = (perms.panel3.sections||[]), p3a = (perms.panel3.actions||[]);
    const chips = (arr,info,cls)=> arr.length
      ? arr.map(k=>`<span class="rolechip ${cls}" style="margin:0 6px 6px 0">${esc(info[k].label)}</span>`).join('')
      : '<span style="color:var(--muted)">Nada habilitado aún.</span>';
    extra = `<div class="card" style="margin-top:22px">
      <div class="card-h"><div><h3>Resumen — Panel 3</h3><div class="sub">Lo que el Panel 2 le ha habilitado al Panel 3 (dentro de lo que tú permitiste)</div></div></div>
      <div class="card-b">
        <div class="pd" style="margin-bottom:6px;font-weight:700">Secciones</div>${chips(p3s,SECTION_INFO,'panel3')}
        <div class="pd" style="margin:14px 0 6px;font-weight:700">Acciones</div>${chips(p3a,ACTION_INFO,'panel3')}
      </div></div>`;
  }

  return `
  <div class="card" style="max-width:900px">
    <div class="card-h">
      <div><h3>Permisos del ${esc(tgtLabel)}</h3>
      <div class="sub">Define qué puede VER (secciones) y qué puede HACER (acciones) el ${esc(tgtLabel)}. Los cambios se aplican a todos en tiempo real.</div></div>
      <div style="margin-left:auto"><span class="rolechip ${tgt}">${curSecs.size} secciones · ${curActs.size} acciones</span></div>
    </div>
    <div class="card-b">
      <div class="section-title" style="margin-top:0">Secciones que puede ver</div>
      <div class="perm-list" id="perm-list-sec">${secItems}</div>
      <div class="section-title">Acciones que puede hacer</div>
      <div class="perm-list" id="perm-list-act">${actItems}</div>
      <div style="display:flex;gap:10px;margin-top:22px;align-items:center">
        <button class="btn primary" id="perm-save"><span>💾</span> Guardar permisos</button>
        <span class="hint" id="perm-status"></span>
      </div>
      ${myRole==='panel2' ? `<p class="req-note">Solo puedes delegar lo que tú tienes disponible. Si tu Jefe te quita algo, se retirará automáticamente del Panel 3.</p>` : ''}
    </div>
  </div>
  ${extra}`;
}

async function guardarAccesos(){
  const tgt = targetRole();
  if(!tgt || !sb) return;
  const secs = [...document.querySelectorAll('#perm-list-sec .perm-item.on')].map(el=>el.dataset.sec);
  const acts = [...document.querySelectorAll('#perm-list-act .perm-item.on')].map(el=>el.dataset.act);
  const status = document.getElementById('perm-status');
  const btn = document.getElementById('perm-save');
  btn.disabled = true; btn.innerHTML = 'Guardando…';
  const {error} = await sb.from('permissions').update({sections:secs, actions:acts}).eq('target_role', tgt);
  btn.disabled = false; btn.innerHTML = '<span>💾</span> Guardar permisos';
  if(error){ status.style.color='var(--danger)'; status.textContent = 'Error: '+error.message; return; }
  perms[tgt] = {sections:secs, actions:acts};
  status.style.color='var(--ok)'; status.textContent = '✓ Permisos actualizados';
  toast('Permisos del '+ROLE_LABEL[tgt]+' guardados');
}

/* ---------- PANEL ---------- */
function renderPanel(){
  const esJefeP2 = (myRole==='jefe'||myRole==='panel2');
  const total = solicitudes.length;
  const enRev = solicitudes.filter(s=>(s.resp_estado||'En revisión')==='En revisión').length;
  const aprob = solicitudes.filter(s=>s.resp_estado==='Aprobada').length;
  const rech  = solicitudes.filter(s=>s.resp_estado==='Rechazada').length;
  const recientes = solicitudes.slice(0,6);

  const kpis = esJefeP2 ? `
    <div class="kpi"><div class="ico" style="background:var(--brand-soft);color:var(--brand)">🏛️</div><div class="val">${municipios.length}</div><div class="lab">Municipalidades</div></div>
    <div class="kpi"><div class="ico" style="background:var(--info-soft);color:var(--info)">📋</div><div class="val">${total}</div><div class="lab">Solicitudes totales</div></div>
    <div class="kpi"><div class="ico" style="background:var(--warn-soft);color:var(--warn)">⏳</div><div class="val">${enRev}</div><div class="lab">Pendientes de respuesta</div></div>
    <div class="kpi"><div class="ico" style="background:var(--ok-soft);color:var(--ok)">✅</div><div class="val">${aprob}</div><div class="lab">Aprobadas</div></div>`
  : `
    <div class="kpi"><div class="ico" style="background:var(--brand-soft);color:var(--brand)">📋</div><div class="val">${total}</div><div class="lab">Mis solicitudes</div></div>
    <div class="kpi"><div class="ico" style="background:var(--warn-soft);color:var(--warn)">⏳</div><div class="val">${enRev}</div><div class="lab">En revisión</div></div>
    <div class="kpi"><div class="ico" style="background:var(--ok-soft);color:var(--ok)">✅</div><div class="val">${aprob}</div><div class="lab">Aprobadas</div></div>
    <div class="kpi"><div class="ico" style="background:var(--danger-soft);color:var(--danger)">⛔</div><div class="val">${rech}</div><div class="lab">Rechazadas</div></div>`;

  const recientesTable = recientes.length ? `<table><thead><tr>${esJefeP2?'<th>Municipalidad</th>':''}<th>Folio</th><th>Tipo</th><th>Fecha</th><th>Respuesta</th></tr></thead><tbody>
    ${recientes.map(s=>`<tr style="cursor:pointer" onclick="openDetalle('${s.id}')">
      ${esJefeP2?`<td><b>${esc(s.municipio_nombre||'—')}</b></td>`:''}
      <td><span class="folio">${esc(s.folio||'')}</span></td>
      <td>${tipoTag(s.tipo)}</td>
      <td>${fmtD(s.fecha_solicitud||s.created_at)}</td>
      <td>${respTag(s.resp_estado)}</td></tr>`).join('')}
    </tbody></table>`
    : `<div class="empty"><div class="ico">📭</div>${esJefeP2?'Aún no hay solicitudes de las municipalidades.':'Aún no has enviado solicitudes.'}</div>`;

  const munCard = esJefeP2 ? `<div class="card" style="margin-top:22px">
      <div class="card-h"><div><h3>Municipalidades</h3><div class="sub">Solicitudes recibidas por municipalidad</div></div>
      <div style="margin-left:auto"><button class="btn sm" onclick="nav('municipios')">Ver detalle →</button></div></div>
      <div class="card-b" style="padding:0">${municipiosTable()}</div></div>` : '';

  return `<div class="kpis">${kpis}</div>
    <div class="card">
      <div class="card-h"><div><h3>${esJefeP2?'Solicitudes recientes':'Mis solicitudes recientes'}</h3><div class="sub">Últimas registradas</div></div>
      <div style="margin-left:auto"><button class="btn sm" onclick="nav('solicitudes')">Ver todas →</button></div></div>
      <div class="card-b" style="padding:0">${recientesTable}</div>
    </div>
    <div class="card" style="margin-top:22px">
      <div class="card-h"><div><h3>Fechas de control pendientes</h3><div class="sub">Solicitudes que requieren registrar una fecha</div></div></div>
      <div class="card-b" style="padding:0">${renderPendientes()}</div>
    </div>
    ${munCard}`;
}
function renderPendientes(){
  const esJefeP2=(myRole==='jefe'||myRole==='panel2');
  const pend = solicitudes.filter(s=>s.resp_estado!=='Rechazada' && (!s.fecha_ingreso_servicio||!s.fecha_notificacion_entrega||!s.fecha_retiro));
  if(!pend.length) return `<div class="empty"><div class="ico">✅</div>No hay fechas de control pendientes.</div>`;
  return `<table><thead><tr>${esJefeP2?'<th>Municipalidad</th>':''}<th>Folio</th><th>Placa</th><th>Próxima fecha por registrar</th><th></th></tr></thead><tbody>
    ${pend.slice(0,10).map(s=>{
      let next='—';
      if(!s.fecha_ingreso_servicio) next='Fecha de ingreso a servicio';
      else if(!s.fecha_notificacion_entrega) next='Notificación de entrega';
      else if(!s.fecha_retiro) next='Retiro del vehículo';
      return `<tr>${esJefeP2?`<td><b>${esc(s.municipio_nombre||'—')}</b></td>`:''}<td><span class="folio">${esc(s.folio||'')}</span></td><td>${plate(s.placa)}</td>
        <td style="color:var(--warn);font-weight:600">⏳ ${next}</td>
        <td class="row-actions"><button class="btn sm primary" onclick="openDetalle('${s.id}')">Registrar</button></td></tr>`;
    }).join('')}
  </tbody></table>`;
}

/* ---------- MUNICIPALIDADES (Jefe / Panel 2) ---------- */
function municipiosTable(){
  if(!municipios.length) return `<div class="empty"><div class="ico">🏛️</div>No hay municipalidades (usuarios Panel 3) registradas todavía.</div>`;
  return `<table><thead><tr><th>Municipalidad</th><th>Solicitudes</th><th>Pendientes</th><th>Aprobadas</th><th>Rechazadas</th><th></th></tr></thead><tbody>
    ${municipios.map(m=>{
      const list=solicitudes.filter(s=>s.municipio_id===m.id);
      const pend=list.filter(s=>(s.resp_estado||'En revisión')==='En revisión').length;
      const apr=list.filter(s=>s.resp_estado==='Aprobada').length;
      const rej=list.filter(s=>s.resp_estado==='Rechazada').length;
      return `<tr>
        <td><b>${esc(m.full_name||'(sin nombre)')}</b></td>
        <td><b>${list.length}</b></td>
        <td>${pend?`<span class="tag s-entregado">⏳ ${pend}</span>`:'—'}</td>
        <td>${apr||'—'}</td>
        <td>${rej||'—'}</td>
        <td class="row-actions"><button class="btn sm" onclick="verMunicipio('${m.id}')">Ver solicitudes</button></td>
      </tr>`;
    }).join('')}
  </tbody></table>`;
}
function renderMunicipios(){
  return `<div class="card">
    <div class="card-h"><div><h3>Municipalidades</h3><div class="sub">Cada municipalidad (Panel 3) con sus solicitudes. Entra a responder desde "Ver solicitudes".</div></div></div>
    <div class="card-b" style="padding:0">${municipiosTable()}</div>
  </div>`;
}

async function crearUsuario(){
  const tgt = createTarget(); if(!tgt || !sb) return;
  const nombre=($('#u-nombre').value||'').trim();
  const email=($('#u-email').value||'').trim();
  const pass=$('#u-pass').value||'';
  const st=$('#u-status');
  if(!nombre||!email||!pass){ st.style.color='var(--danger)'; st.textContent='Completa nombre, correo y contraseña.'; return; }
  if(pass.length<6){ st.style.color='var(--danger)'; st.textContent='La contraseña debe tener al menos 6 caracteres.'; return; }
  const btn=$('#u-crear'); btn.disabled=true; btn.innerHTML='Creando…';
  let errMsg=null;
  try{
    const { data, error } = await sb.functions.invoke('crear-usuario', { body:{ email, password:pass, nombre, rol:tgt } });
    if(error){ errMsg = (data&&data.error) || error.message || 'Error del servidor'; }
    else if(data && data.error){ errMsg = data.error; }
  }catch(e){ errMsg=String(e); }
  btn.disabled=false; btn.innerHTML='<span>➕</span> Crear';
  if(errMsg){ st.style.color='var(--danger)'; st.textContent='Error: '+errMsg; return; }
  st.style.color='var(--ok)'; st.textContent='✓ Cuenta creada correctamente';
  toast('Cuenta creada');
  await loadData(); render();
}

      <div class="section-title">Respuesta de la plataforma</div>
      <div class="kv"><span class="k">Estado</span><span class="v">${respTag(est)}</span></div>
      ${s.resp_comentario?`<div class="kv"><span class="k">Comentario</span><span class="v" style="max-width:60%;text-align:right">${esc(s.resp_comentario)}</span></div>`:''}
      ${(!esJefeP2 && est==='En revisión')?`<div class="hint" style="margin-top:6px">Tu solicitud está en revisión. Aquí verás el estado y el comentario cuando la plataforma responda.</div>`:''}

      ${puedeResponder?`
      <div class="section-title">Responder a la municipalidad</div>
      <div class="form-grid">
        <div class="field"><label>Estado</label>
          <select id="r-estado">${RESP_ESTADOS.map(e=>`<option ${e===est?'selected':''}>${e}</option>`).join('')}</select></div>
        <div class="field full"><label>Comentario / feedback</label>
          <textarea id="r-com" placeholder="Escribe la respuesta para la municipalidad...">${esc(s.resp_comentario||'')}</textarea></div>
      </div>`:''}
    </div>
    <div class="modal-f">
      ${can('eliminar')?`<button class="btn danger" onclick="eliminarSol('${s.id}')">Eliminar</button>`:''}
      <button class="btn" onclick="closeModal()">Cerrar</button>
      ${puedeResponder?`<button class="btn primary" onclick="guardarRespuesta('${s.id}')"><span>💾</span> Enviar respuesta</button>`:''}
    </div>`;
  $('#overlay').classList.add('show');
}
async function guardarFechas(id){
  if(!can('editar')){ toast('No tienes permiso para registrar fechas'); return; }
  const patch={
    fecha_solicitud: $('#d-fsol').value || null,
    fecha_ingreso_servicio: $('#d-fing').value || null,
    fecha_notificacion_entrega: $('#d-fnot').value || null,
    fecha_retiro: $('#d-fret').value || null,
  };
  const {error}=await sb.from('solicitudes').update(patch).eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  await loadData(); closeModal(); render(); toast('Fechas de control actualizadas');
}
async function guardarRespuesta(id){
  if(!((myRole==='jefe'||myRole==='panel2') && can('editar'))){ toast('No tienes permiso para responder'); return; }
  const estado=$('#r-estado').value; const com=($('#r-com').value||'').trim();
  const {error}=await sb.from('solicitudes').update({resp_estado:estado, resp_comentario:com, respondido_por:session.user.id, respondido_at:new Date().toISOString()}).eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  await loadData(); closeModal(); render(); toast('Respuesta enviada a la municipalidad');
}
async function eliminarSol(id){
  if(!can('eliminar')){ toast('No tienes permiso para eliminar'); return; }
  const {error}=await sb.from('solicitudes').delete().eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  await loadData(); closeModal(); render(); toast('Solicitud eliminada');
}

/* ---------- Detalle vehículo ---------- */
function openVehiculo(id){
  const v=vehiculos.find(x=>x.id===id); if(!v) return;
  const esJefeP2=(myRole==='jefe'||myRole==='panel2');
  const hist=solicitudes.filter(s=>s.placa===v.placa).sort((a,b)=>((b.fecha_solicitud||'')+'').localeCompare((a.fecha_solicitud||'')+''));
  const puedeQuitar = esJefeP2 || v.municipio_id===session?.user?.id;
  $('#modal').innerHTML=`
    <div class="modal-h"><span class="plate">${esc(v.placa)}</span><h3 style="margin-left:4px">${esc(v.marca)} ${esc(v.modelo)}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b">
      <div class="grid-3" style="gap:12px">
        <div class="kpi" style="box-shadow:none;padding:14px"><div class="lab">Año</div><div style="font-weight:700;font-size:16px">${esc(v.anio||'—')}</div></div>
        <div class="kpi" style="box-shadow:none;padding:14px"><div class="lab">Color</div><div style="font-weight:700;font-size:16px">${esc(v.color||'—')}</div></div>
        <div class="kpi" style="box-shadow:none;padding:14px"><div class="lab">Estado</div><div style="font-weight:700;font-size:16px">${esc(v.estado)}</div></div>
      </div>
      <div class="kv" style="margin-top:12px"><span class="k">Municipalidad</span><span class="v">${esc(v.municipio_nombre||'—')}</span></div>
      <div class="section-title">Historial de la placa patente <span style="color:var(--muted2)">(${hist.length})</span></div>
      ${hist.length?`<ul class="veh-hist" style="list-style:none;padding:0;margin:0">
        ${hist.map(s=>`<li>
          <span class="mini-date">${fmtD(s.fecha_solicitud||s.created_at)}</span>
          <div style="flex:1">${tipoTag(s.tipo)} <span class="folio">${esc(s.folio||'')}</span><div class="hint">${esc(s.descripcion||'')}</div></div>
          ${respTag(s.resp_estado)}
        </li>`).join('')}
      </ul>`:`<div class="empty"><div class="ico">📭</div>Sin solicitudes asociadas.</div>`}
    </div>
    <div class="modal-f">
      ${puedeQuitar ? `<button class="btn danger" onclick="eliminarVeh('${v.id}')">Quitar vehículo</button>` : ''}
      <button class="btn primary" onclick="closeModal()">Cerrar</button>
    </div>`;
  $('#overlay').classList.add('show');
}
async function eliminarVeh(id){
  const {error}=await sb.from('vehiculos').delete().eq('id',id);
  if(error){ toast('Error: '+error.message); return; }
  await loadData(); closeModal(); render(); toast('Vehículo quitado');
}

/* ---------- Asignar vehículo (modal, solo Jefe / Panel 2) ---------- */
function openNuevoVehiculo(){
  if(!(myRole==='jefe'||myRole==='panel2')){ toast('Solo el Panel 2 asigna vehículos'); return; }
  $('#modal').innerHTML=`
    <div class="modal-h"><h3>Asignar vehículo a una municipalidad</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b">
      <div class="form-grid">
        <div class="field full"><label>Municipalidad <span class="req">*</span></label>
          <select id="v-muni"><option value="">— Selecciona la municipalidad —</option>
            ${municipios.map(m=>`<option value="${m.id}">${esc(m.full_name||m.id)}</option>`).join('')}</select></div>
        <div class="field"><label>Placa patente <span class="req">*</span></label><input type="text" id="v-placa" placeholder="Ej: GKRT-45" style="text-transform:uppercase"></div>
        <div class="field"><label>Marca</label><input type="text" id="v-marca" placeholder="Ej: Toyota"></div>
        <div class="field"><label>Modelo</label><input type="text" id="v-modelo" placeholder="Ej: Corolla"></div>
        <div class="field"><label>Año</label><input type="text" id="v-anio" placeholder="Ej: 2024"></div>
        <div class="field"><label>Color</label><input type="text" id="v-color" placeholder="Ej: Blanco"></div>
        <div class="field"><label>Estado</label><select id="v-estado"><option>Disponible</option><option>Asignado</option><option>En taller</option></select></div>
      </div>
      ${municipios.length?'':'<p class="req-note">Primero crea una municipalidad en la sección "Usuarios".</p>'}
    </div>
    <div class="modal-f">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn primary" onclick="guardarVehiculo()"><span>💾</span> Asignar vehículo</button>
    </div>`;
  $('#overlay').classList.add('show');
}
async function guardarVehiculo(){
  if(!(myRole==='jefe'||myRole==='panel2')){ toast('No autorizado'); return; }
  const muniId=$('#v-muni').value;
  if(!muniId){ toast('Selecciona la municipalidad'); return; }
  const placa=($('#v-placa').value||'').trim().toUpperCase();
  if(!placa){ toast('Ingresa la placa patente'); return; }
  const muni=municipios.find(m=>m.id===muniId);
  const {error}=await sb.from('vehiculos').insert({
    placa, marca:$('#v-marca').value||'', modelo:$('#v-modelo').value||'',
    anio:$('#v-anio').value||'', color:$('#v-color').value||'', estado:$('#v-estado').value,
    municipio_id:muniId, municipio_nombre:muni?.full_name||''
  });
  if(error){ toast('Error: '+error.message); return; }
  await loadData(); closeModal(); render(); toast('Vehículo '+placa+' asignado a '+(muni?.full_name||'la municipalidad'));
}

/* ---------- Guardar nueva solicitud ---------- */
async function guardarNueva(){
  if(!can('crear')){ toast('No tienes permiso para crear'); return; }
  const tipo=(document.querySelector('input[name="tipo"]:checked')||{}).value;
  const desc=($('#f-desc').value||'').trim();
  if(!desc){ toast('Describe la solicitud'); $('#f-desc').focus(); return; }
  const fsol=$('#f-fsolicitud').value||todayISO();
  const folio='SOL-'+new Date(fsol+'T00:00:00').getFullYear()+'-'+String(Math.floor(Math.random()*9000)+1000);
  const {error}=await sb.from('solicitudes').insert({
    folio, tipo,
    municipio_id: session.user.id,
    municipio_nombre: myName,
    placa:($('#f-placa').value||'').trim().toUpperCase(),
    contacto:$('#f-contacto').value||'',
    sucursal:$('#f-sucursal').value||'',
    descripcion:desc,
    fecha_solicitud:fsol,
    resp_estado:'En revisión'
  });
  if(error){ toast('Error: '+error.message); return; }
  await loadData();
  toast('Solicitud '+folio+' enviada');
  nav('solicitudes');
}
function openNueva(){ nav('nueva'); }

/* ============================================================
   EXPORTACIÓN (extracción de base de datos)
   ============================================================ */
function download(filename, content, mime){
  if(!can('exportar')){ toast('No tienes permiso para exportar'); return; }
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function csvCell(v){ v=(v??'').toString(); return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCSV(){
  const head=['Folio','Municipalidad','Tipo de solicitud','Placa patente','Contacto','Sucursal',
    'Fecha de solicitud','Fecha de ingreso a servicio','Fecha de notificacion de entrega','Fecha de retiro',
    'Estado de respuesta','Comentario','Descripcion'];
  const rows=solicitudes.map(s=>[s.folio,s.municipio_nombre,s.tipo,s.placa,s.contacto,s.sucursal,
    (s.fecha_solicitud||''),(s.fecha_ingreso_servicio||''),(s.fecha_notificacion_entrega||''),(s.fecha_retiro||''),
    (s.resp_estado||'En revisión'),s.resp_comentario,s.descripcion].map(csvCell).join(';'));
  const csv='﻿'+[head.join(';'),...rows].join('\n');
  download('solicitudes_'+todayISO()+'.csv', csv, 'text/csv;charset=utf-8');
  toast('Base de datos exportada ('+solicitudes.length+' registros)');
}
function exportVehCSV(){
  const head=['Placa patente','Marca','Modelo','Anio','Color','Estado','N solicitudes'];
  const rows=vehiculos.map(v=>[v.placa,v.marca,v.modelo,v.anio,v.color,v.estado,
    solicitudes.filter(s=>s.placa===v.placa).length].map(csvCell).join(';'));
  download('vehiculos_'+todayISO()+'.csv','﻿'+[head.join(';'),...rows].join('\n'),'text/csv;charset=utf-8');
  toast('Registro de vehículos exportado');
}
function exportJSON(){
  download('solicitudes_'+todayISO()+'.json', JSON.stringify(solicitudes,null,2),'application/json');
  toast('Solicitudes exportadas (JSON)');
}
function exportAll(){
  const data={generado:new Date().toISOString(), solicitudes, vehiculos};
  download('plataforma_export_'+todayISO()+'.json', JSON.stringify(data,null,2),'application/json');
  toast('Exportación completa generada');
}

/* ============================================================
   HANDLERS DE VISTA
   ============================================================ */
function attachViewHandlers(){
  if(currentView==='solicitudes'){
    const sq=$('#sq'); if(sq){ sq.oninput=e=>{searchQ=e.target.value; $('#sol-table').innerHTML=renderSolTable();};
      sq.focus(); sq.setSelectionRange(sq.value.length,sq.value.length); }
    document.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{filterTipo=b.dataset.tipo; render();});
    const cm=$('#clear-mun'); if(cm) cm.onclick=()=>{ filterMun=''; render(); };
  }
  if(currentView==='vehiculos'){
    const vq=$('#vq'); if(vq) vq.oninput=e=>{ $('#veh-table').innerHTML=renderVehTable(e.target.value); };
  }
  if(currentView==='nueva'){
    document.querySelectorAll('[data-tipo-card]').forEach(card=>{
      const upd=()=>document.querySelectorAll('[data-tipo-card]').forEach(c=>{
        const on=c.querySelector('input').checked;
        c.style.borderColor=on?'var(--brand)':'var(--line)';
        c.style.background=on?'var(--brand-soft)':'#fff';
      });
      card.onclick=()=>{card.querySelector('input').checked=true; upd();};
      upd();
    });
  }
  if(currentView==='accesos'){
    document.querySelectorAll('#perm-list-sec .perm-item, #perm-list-act .perm-item').forEach(el=>{
      if(el.classList.contains('locked')) return;
      el.onclick=()=>el.classList.toggle('on');
    });
    const sv=$('#perm-save'); if(sv) sv.onclick=guardarAccesos;
  }
  if(currentView==='usuarios'){
    const uc=$('#u-crear'); if(uc) uc.onclick=crearUsuario;
  }
}
function closeModal(){ $('#overlay').classList.remove('show'); }
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ============================================================
   INIT — flujo de sesión
   ============================================================ */
document.getElementById('auth-form').addEventListener('submit', doLogin);
document.getElementById('btn-logout').addEventListener('click', doLogout);

(async function init(){
  if(!sb){
    // Sin conexión configurada: mostrar aviso en la pantalla de login
    authErr('La plataforma todavía no está conectada a Supabase. Falta configurar la URL y la anon key.');
    return;
  }
  const {data:{session:s}} = await sb.auth.getSession();
  if(s){ session = s; await startApp(); }
  // Reacciona a cambios de sesión (login / logout en otra pestaña)
  sb.auth.onAuthStateChange(async (_event, s2)=>{
    if(s2 && (!session || session.user.id !== s2.user.id)){
      session = s2; await startApp();
    }
  });
})();
</script>
